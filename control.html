<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主控台｜FA26 辯論比賽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container control-page">
    <div id="gate" class="card"><p class="muted">載入中…</p></div>

    <div id="control-area" class="hidden">
      <!-- 目前段落 -->
      <section class="card now-card" id="now-card"></section>

      <!-- 大按鈕 -->
      <section class="ctl-grid" id="main-buttons">
        <button class="btn ctl-btn" data-act="prev" type="button">◀ 上一項</button>
        <button class="btn btn-primary ctl-btn" data-act="next" type="button">下一項 ▶</button>
        <button class="btn ctl-btn" data-act="pause" type="button">⏸ 暫停</button>
        <button class="btn ctl-btn" data-act="restart" type="button">↺ 重新計時</button>
        <button class="btn ctl-btn" data-act="minus" type="button">−30 秒</button>
        <button class="btn ctl-btn" data-act="plus" type="button">+30 秒</button>
        <button class="btn btn-yellow ctl-btn ctl-wide" data-act="done" type="button">代按「我說完了」</button>
      </section>

      <!-- 依段落出現的區塊：猜硬幣、投票 -->
      <section id="extra"></section>

      <section class="section">
        <h2 class="section-title">完整流程</h2>
        <p class="muted small">點任一段可以直接跳過去（會先確認）。</p>
        <div id="rundown-list"></div>
      </section>

      <section class="section" id="sec-comments">
        <h2 class="section-title">觀眾留言</h2>
        <p class="muted small">按「投影」挑 3～5 則給主持人在台上介紹，投影畫面在「宣讀高人氣觀眾留言」和第三輪主持人開場時會大字顯示。不適合的留言按「隱藏」，觀眾就看不到。</p>
        <div class="card" id="cm-featured"></div>
        <div class="row" id="cm-ctl-tabs" style="margin:14px 0 8px"></div>
        <div class="card" id="cm-ctl-list"><p class="muted">載入中…</p></div>
      </section>

      <section class="section">
        <h2 class="section-title">之後的功能</h2>
        <div class="card muted small">
          MVP 選擇與頒獎步驟（第 6 階段）會放在這一頁。
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="js/control.js"></script>
</body>
</html>
