<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>留言牆｜FA26 辯論比賽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container cm-page" style="max-width:680px">
    <div id="gate" class="card"><p class="muted">載入中…</p></div>
    <div id="cm-area" class="hidden">
      <div class="row cm-tabs" id="cm-tabs"></div>

      <form class="card cm-form" id="cm-form" autocomplete="off">
        <label class="cm-label" for="cm-text">想對選手說什麼？想問什麼？</label>
        <textarea id="cm-text" maxlength="100" rows="3" placeholder="最多 100 字"></textarea>
        <div class="row cm-form-row">
          <label class="cm-name">顯示名稱
            <input type="text" id="cm-name" maxlength="20" placeholder="匿名">
          </label>
          <span class="spacer"></span>
          <span class="small muted" id="cm-count">0／100</span>
          <button class="btn btn-primary" id="cm-send" type="submit">送出留言</button>
        </div>
        <p class="small muted" style="margin:6px 0 0">名稱可以自己取，不填就顯示「匿名」。熱門的留言可能會被老師挑出來，由主持人在台上唸出來。</p>
      </form>

      <div class="row cm-sort" id="cm-sort">
        <b id="cm-total"></b>
        <span class="spacer"></span>
        <button class="btn btn-small" data-sort="hot" type="button">🔥 最熱門</button>
        <button class="btn btn-small" data-sort="new" type="button">🕒 最新</button>
      </div>
      <div id="cm-list"></div>
    </div>
  </main>

  <script type="module" src="js/comments.js"></script>
</body>
</html>
